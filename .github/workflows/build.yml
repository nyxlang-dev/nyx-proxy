name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build with Nyx toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Las guardas del método SDD corren primero: son bash puro, no necesitan el
      # toolchain, y si el INDEX quedó desfasado o un documento publica una ruta de
      # máquina conviene saberlo antes de gastar tres minutos instalando Nyx.
      - name: SDD selftest and docs guards
        run: |
          make sdd-check
          make docs-health

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make git libgc-dev libssl-dev zlib1g-dev

      - name: Install Nyx toolchain
        run: |
          curl -sSf https://nyxlang.com/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify toolchain
        run: nyx --version

      - name: Build product
        run: nyx build

      - name: Verify binary produced
        run: |
          BIN=$(basename "$PWD")
          if [ ! -x "./$BIN" ]; then
              echo "ERROR: binary $BIN not found after nyx build"
              exit 1
          fi
          echo "✓ Binary $BIN produced successfully"
          ls -lh "./$BIN"

      # El ejemplo TLS/SNI también compila en cada push. Sin este paso, el
      # camino TLS quedaba sin compilar por nadie — así sobrevivió años un
      # puntero muerto a services/gateway/. Se pre-siembra packages/ con el
      # checkout ACTUAL (no un clone de red, que traería main y taparía
      # regresiones del PR).
      - name: Build gateway-tls example
        run: |
          cd examples/gateway-tls
          mkdir -p packages/nyx-proxy
          cp -r ../../src ../../nyx.toml packages/nyx-proxy/
          nyx build
          if [ ! -x ./gateway-tls ]; then
              echo "ERROR: examples/gateway-tls did not build"
              exit 1
          fi
          echo "✓ gateway-tls example builds"
